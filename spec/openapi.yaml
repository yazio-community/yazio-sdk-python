  /v22/products/search:
    get:
      tags:
        - Products
      operationId: searchProducts
      summary: Search products by text or barcode
      description: Free-text or barcode search. Results are ranked by the request's `Accept-Language`, so the same query answers differently for a German and an English client.
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ProductSearchResult'
      parameters:
        - name: query
          in: query
          required: true
          schema:
            type: string
        - name: sex
          in: query
          required: true
          schema:
            type: string
        - name: countries
          in: query
          required: true
          schema:
            type: string
        - name: locales
          in: query
          required: false
          schema:
            type: string
