name: Publish SDK

on:
  push:
    tags: ["v*"]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Regenerate and confirm the tag ships what its spec produces
        # src/ is committed, so this proves the tagged tree really is what
        # spec/openapi.yaml generates rather than something hand-edited, and
        # generate.sh's last step imports every module.
        #
        # This is the gate before something irreversible: a PyPI version cannot
        # be re-uploaded, so a bad package costs a tag if caught here and the
        # version number permanently if caught after upload.
        run: |
          pip install openapi-python-client==0.29.0 python-dateutil PyYAML ruff==0.15.22
          bash scripts/generate.sh
          if ! git diff --quiet -- src/; then
            echo "::error::src/ at this tag does not match spec/openapi.yaml"
            git diff --stat -- src/
            exit 1
          fi

      - name: Check the tag matches the generated version
        # The version is not written in pyproject.toml — it comes from
        # src/yazio_sdk/_version.py, which scripts/generate.sh writes from the
        # spec's info.version. So this checks three things at once: that the tag
        # matches the code, that the code matches the spec it was generated
        # from, and that nobody tagged a checkout they forgot to regenerate.
        #
        # It matters because PyPI will not let you re-upload a version to fix it.
        #
        # 0.0.0-dev is what the spec repo's bundle carries between releases. A
        # checkout generated from one never went through that repo's release
        # workflow, so publishing it would put a version on PyPI that no spec
        # release corresponds to.
        run: |
          version=$(uvx hatch version)
          tag="${GITHUB_REF_NAME#v}"

          case "$version" in
            *dev*)
              echo "::error::refusing to publish $version — regenerate from a spec release first"
              exit 1
              ;;
          esac

          if [ "$tag" != "$version" ]; then
            echo "::error::tag v$tag does not match generated version $version"
            echo "the spec in spec/openapi.yaml pins $version — tag v$version instead"
            exit 1
          fi

          echo "publishing $version"

      - run: uv build
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  pypi:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      # Trusted publishing: PyPI verifies this workflow's OIDC identity, so
      # there is no API token to store or rotate. The publisher is configured
      # against this filename and this environment name, so renaming either
      # breaks authentication with a fairly unhelpful error.
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      # Publishes to pypi.org. Add `repository-url: https://test.pypi.org/legacy/`
      # to rehearse against TestPyPI instead — the two are separate accounts
      # with separate trusted publishers, so neither configuration carries over.
      - uses: pypa/gh-action-pypi-publish@release/v1

  release:
    needs: pypi
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
