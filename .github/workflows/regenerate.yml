name: Regenerate

# Two things live here because they are the same work with different triggers:
# build the package from a spec and prove it holds together.
#
#   verify    on a PR or a push to main — checks the spec already committed
#   propose   on a dispatch from the spec repo — checks a *new* spec, then
#             opens a PR pinning it
#
# The checks have to run inside `propose`, before the PR is opened, rather than
# in a separate workflow triggered by that PR. A pull request created with the
# default GITHUB_TOKEN does not trigger other workflows — GitHub blocks that to
# avoid recursion — so a `pull_request`-triggered CI file would never fire on
# the regenerate PRs, which are the only PRs this repo normally gets.
#
# There is no test suite to run. scripts/generate.sh imports every generated
# module as its last step, so generating *is* the smoke test; the matrix below
# runs that import walk on both ends of the supported Python range.
on:
  repository_dispatch:
    types: [spec-released]
  workflow_dispatch:
    inputs:
      spec_tag:
        description: "Spec release tag to generate from (e.g. v0.2.0)"
        required: true
  pull_request:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

env:
  SPEC_REPO: yazio-community/yazio-api-specification
  # Requires Python >=3.11 itself, which is why generation and the import check
  # below run on different interpreters.
  GENERATOR: openapi-python-client==0.29.0
  # httpx and attrs arrive with the generator, but generate.sh imports every
  # module it wrote and the date/date-time ones need python-dateutil. PyYAML
  # reads info.version out of the spec.
  #
  # ruff is pinned to shell.nix's version. Floating it means the generator's
  # format post-hook produces different output in CI than locally, and a new
  # ruff release breaks the build with nothing on our side having changed.
  TOOLING: python-dateutil PyYAML ruff==0.15.22
  # Generation only. The generated package supports >=3.10; see `check`.
  GENERATOR_PYTHON: "3.12"

jobs:
  verify:
    # The committed spec, on human-authored changes. src/ is not in the repo, so
    # this is the only thing that ever proves spec/openapi.yaml still produces a
    # package that imports.
    if: github.event_name == 'pull_request' || github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.GENERATOR_PYTHON }}
      - run: pip install ${{ env.GENERATOR }} ${{ env.TOOLING }}
      - name: Generate
        run: bash scripts/generate.sh
      - name: Lint
        # ruff skips src/ via extend-exclude — the generator already formatted it.
        run: |
          ruff check .
          ruff format --check .
      - uses: actions/upload-artifact@v4
        with:
          name: package
          path: src/yazio_sdk/
          include-hidden-files: true

  check:
    # The generated package on both ends of pyproject.toml's requires-python.
    # It cannot be generated here: openapi-python-client needs >=3.11 while the
    # package it produces supports >=3.10, so `verify` generates once on 3.12
    # and this imports that output under each supported version. Nothing else
    # checks the classifiers are true.
    needs: verify
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: package
          path: src/yazio_sdk/
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      # Runtime dependencies only — the generator is deliberately absent.
      - run: pip install httpx attrs python-dateutil
      - name: Import every generated module
        run: PYTHONPATH=src python scripts/verify_imports.py

  propose:
    # A new spec release. Generates from it, proves it works, and only then
    # opens the PR that pins it.
    if: github.event_name == 'repository_dispatch' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    env:
      # The tag, not the version. The spec repo sends both because they are
      # different strings: spec_tag is `v1.4.2` and builds the download URL,
      # spec_version is `1.4.2` and is what gets published. Using the wrong one
      # here 404s. Nothing below needs spec_version — the asset carries it in
      # info.version and scripts/generate.sh reads it from there, which is what
      # makes the published version equal the spec release by construction.
      SPEC_TAG: ${{ github.event.client_payload.spec_tag || inputs.spec_tag }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ${{ env.GENERATOR }} ${{ env.TOOLING }}

      - name: Record the current public surface
        # src/ is not committed, so the PR diff is a one-line spec bump and
        # shows nothing about what that does to callers. Generating from the
        # *old* spec first gives something to compare against.
        run: |
          bash scripts/generate.sh
          bash scripts/public_surface.sh > /tmp/before.txt

      - name: Fetch the released spec
        run: |
          curl -sSLf \
            "https://github.com/${SPEC_REPO}/releases/download/${SPEC_TAG}/openapi.yaml" \
            -o spec/openapi.yaml

      - name: Regenerate
        run: bash scripts/generate.sh

      - name: Lint
        run: |
          ruff check .
          ruff format --check .

      - name: Read the version the spec pinned
        id: version
        run: |
          version=$(python3 -c "import yaml;print(yaml.safe_load(open('spec/openapi.yaml'))['info']['version'])")
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Diff the public surface
        id: surface
        run: |
          bash scripts/public_surface.sh > /tmp/after.txt

          {
            echo "surface<<SURFACE_EOF"
            if diff -q /tmp/before.txt /tmp/after.txt >/dev/null; then
              echo "No change to the public surface — descriptions or examples only."
            else
              echo '```diff'
              diff -u /tmp/before.txt /tmp/after.txt | tail -n +3 | grep -E '^[+-]' || true
              echo '```'
              if diff /tmp/before.txt /tmp/after.txt | grep -q '^<'; then
                echo
                echo "⚠️ Symbols were **removed or renamed**. This breaks callers."
              fi
            fi
            echo "SURFACE_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Open a pull request
        uses: peter-evans/create-pull-request@v7
        with:
          branch: spec/${{ env.SPEC_TAG }}
          commit-message: "Regenerate from spec ${{ env.SPEC_TAG }}"
          title: "Regenerate from spec ${{ env.SPEC_TAG }}"
          body: |
            Generated from [${{ env.SPEC_TAG }}](https://github.com/${{ env.SPEC_REPO }}/releases/tag/${{ env.SPEC_TAG }}).

            This spec generated cleanly and every generated module imported,
            before the PR was opened.

            ## What this does to callers

            `src/` is not committed, so the file diff here is just the spec bump.
            This is the part that matters — every client function and model as
            callers import them, before and after:

            ${{ steps.surface.outputs.surface }}

            **The version is already decided: `${{ steps.version.outputs.version }}`.**
            It comes from the spec's `info.version` and is written into
            `src/yazio_sdk/_version.py`, so there is nothing to bump by hand. If
            that number is wrong for what changed here, the fix is a different
            spec release rather than an edit in this repo.

            Merging does not publish. Tag the merge commit to release:

            ```
            git tag v${{ steps.version.outputs.version }}
            git push origin v${{ steps.version.outputs.version }}
            ```
          labels: generated
          delete-branch: true
